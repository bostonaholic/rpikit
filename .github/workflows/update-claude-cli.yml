name: Update Claude CLI Version

on:
  schedule:
    - cron: '0 9 * * 1' # Weekly on Monday at 9am UTC
  workflow_dispatch: # Manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Check for Claude CLI update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Check for newer version
        id: check
        run: |
          current=$(cat .claude-code-version | tr -d '[:space:]')
          latest=$(npm show @anthropic-ai/claude-code version)
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          if [ "$current" != "$latest" ]; then
            echo "updated=true" >> "$GITHUB_OUTPUT"
          else
            echo "updated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update version file
        if: steps.check.outputs.updated == 'true'
        env:
          LATEST_VERSION: ${{ steps.check.outputs.latest }}
        run: echo "$LATEST_VERSION" > .claude-code-version

      - name: Create pull request
        id: cpr
        if: steps.check.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: 'chore(deps): update Claude CLI from ${{ steps.check.outputs.current }} to ${{ steps.check.outputs.latest }}'
          title: 'chore(deps): update Claude CLI to ${{ steps.check.outputs.latest }}'
          body: |
            Updates `@anthropic-ai/claude-code` from `${{ steps.check.outputs.current }}` to `${{ steps.check.outputs.latest }}`.

            This PR was auto-generated by the `update-claude-cli` workflow.
          add-paths: .claude-code-version
          branch: update-claude-cli
          delete-branch: true

      - name: Enable native auto-merge
        if: steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GATE_MODE: claude-cli
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
          EXPECTED_HEAD_SHA: ${{ steps.cpr.outputs.pull-request-head-sha }}
          EXPECTED_VERSION: ${{ steps.check.outputs.latest }}
          TRUSTED_SHA: ${{ github.sha }}
          SCRIPT_PATH: .github/scripts/enable-native-auto-merge.sh
        run: |
          set -euo pipefail
          if [[ ! "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Refusing: trusted SHA is not a full commit id" >&2
            exit 1
          fi
          if [[ "$SCRIPT_PATH" != ".github/scripts/enable-native-auto-merge.sh" ]]; then
            echo "Refusing: unexpected trusted script path" >&2
            exit 1
          fi
          dest="${RUNNER_TEMP}/enable-native-auto-merge.sh"
          meta="$(gh api "repos/${REPO}/contents/${SCRIPT_PATH}?ref=${TRUSTED_SHA}")"
          encoding="$(jq -r '.encoding' <<<"$meta")"
          if [[ "$encoding" != "base64" ]]; then
            echo "Refusing: trusted script encoding is ${encoding}" >&2
            exit 1
          fi
          jq -r '.content' <<<"$meta" | base64 -d > "$dest"
          bash "$dest"

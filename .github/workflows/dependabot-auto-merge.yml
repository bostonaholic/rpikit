# Enable GitHub native auto-merge for Dependabot pull requests.
#
# pull_request_target runs this file from the base branch and can grant a
# write token. The job must not check out the pull request, must not run code
# from the head SHA, and must not call a direct merge. The script only calls
# `gh pr merge --auto` after active branch rules require the CI jobs.
name: Enable Dependabot native auto-merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  enable:
    name: Enable native auto-merge
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Enable native auto-merge from the trusted base script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SCRIPT_PATH: .github/scripts/enable-dependabot-auto-merge.sh
        run: |
          set -euo pipefail
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Refusing: base SHA is not a full commit id" >&2
            exit 1
          fi
          if [[ ! "$REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "Refusing: repository name is unexpected" >&2
            exit 1
          fi
          if [[ "$SCRIPT_PATH" != ".github/scripts/enable-dependabot-auto-merge.sh" ]]; then
            echo "Refusing: unexpected trusted script path" >&2
            exit 1
          fi
          dest="${RUNNER_TEMP}/enable-dependabot-auto-merge.sh"
          meta="$(gh api "repos/${REPO}/contents/${SCRIPT_PATH}?ref=${BASE_SHA}")"
          encoding="$(jq -r '.encoding' <<<"$meta")"
          if [[ "$encoding" != "base64" ]]; then
            echo "Refusing: trusted script encoding is ${encoding}" >&2
            exit 1
          fi
          jq -r '.content' <<<"$meta" | base64 -d > "$dest"
          bash "$dest"
